<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire mitigation impacts</title>
  
<style>
:root{--ink:#202522;--muted:#5c655f;--line:#d8ded9;--accent:#28684f;--accent-soft:#e4eee8;--focus:#28684f;--max-width:900px}
  
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font-family: Arial,sans-serif;line-height:1.5}
  
.scenario-widget{width:min(100%,var(--max-width));margin:0 auto;padding:clamp(10px,1px,28px)}
    
h1{margin:0;max-width:24ch;font-size:30px;line-height:0.3;letter-spacing:-.035em}
  
.image-frame{position:relative;overflow:hidden; width:100%;height: 20%; background:#e8ece9;border-radius:5px}.scenario-image{display: block; width: 100%;
  height: auto;}
  
.scenario-title{margin:1 0 7px;font-size: 20px;line-height:1.2;letter-spacing:-.02em}.scenario-caption{max-width:72ch;margin:0;color:#3d4540;font-size:1rem}
.controls{padding-top:18px}.control-topline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}.control-label{font-size:.9rem;font-weight:700}.current-step{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.range{display:block;width:100%;margin:12px 0 8px;accent-color:var(--accent);cursor:pointer}.range:focus-visible,.scenario-button:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  
.step-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.scenario-button{
  min-width:0;
  min-height:20px;
  padding:8px 5px;
  border:1px solid var(--line);
  border-radius:4px;
  color:var(--ink);
  background:#fff;
  font-family: Arial, sans-serif;
  font-size:.78rem;
  line-height:1.2;
  cursor:pointer;
  overflow-wrap:anywhere}
  
.scenario-button[aria-pressed="true"]{border-color:var(--accent);color:#174a36;background:var(--accent-soft);font-weight:750}
  
.widget-note{margin:1px 0 0;padding-top:1px; color:var(--muted);font-size:.6rem}
@media(max-width:540px){.scenario-widget{padding:16px 0}.step-buttons{gap:5px}.scenario-button{padding:3px 3px;font-size:.5rem}}
@media(prefers-reduced-motion:no-preference){.scenario-image{animation:appear 180ms ease-out}@keyframes appear{from{opacity:.72}to{opacity:1}}}
  

/* Legend below the image */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 20px;
  align-items: center;
  padding: 2px 0 12px;
  font-size: 0.7rem;
  color: var(--ink);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
}

.legend-square {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  border: 1px solid rgba(0, 0, 0, 0.15);
  border-radius: 2px;
}

/* Customize these four colors */
.legend-1 { background: #800126; }
.legend-2 { background: #F33D25; }
.legend-3 { background: #FEBE5A; }
.legend-4 { background: #FFFFFF; }    
.legend-title{
  width: 100%;
  font-weight: 700;
  font-size: 0.8rem;
  margin-bottom: 2px;
}
</style></head>
  
  
<body><main class="scenario-widget">
<h1>Fire mitigation impacts</h1>
  
<section class="controls" aria-label="Scenario controls">
<div class="control-topline"><label class="control-label" for="scenario-range">Compare scenarios</label></div>
  
<div class="step-buttons" aria-label="Choose a scenario">
<button class="scenario-button" type="button" data-index="0" aria-pressed="true">1 · No mitigation</button>
<button class="scenario-button" type="button" data-index="1" aria-pressed="false">2 · Mitigation ($5M)</button>
<button class="scenario-button" type="button" data-index="2" aria-pressed="false">3 · Mitigation and Hardening ($5M)</button>
<button class="scenario-button" type="button" data-index="3" aria-pressed="false">4 · Mitigation ($25M)</button>
<button class="scenario-button" type="button" data-index="4" aria-pressed="false">5 · Mitigation and Hardening ($25M)</button>

      
  </div></section>  
  
   
<figure style="margin:20px O O"><div class="image-frame"><img id="scenario-image" class="scenario-image" src="images/scenario-1.jpg" alt="Landscape under current conditions" width="800" height="500"></div></figure>
  
<div class="legend" aria-label="Map legend">
  <div class="legend-title">Percentage of modeled fire scenarios reaching each location</div>
  <div class="legend-item">
    <span class="legend-square legend-1"></span>
    <span>75% or more</span>
  </div>
  <div class="legend-item">
    <span class="legend-square legend-2"></span>
    <span>50% to less than 75%</span>
  </div>
  <div class="legend-item">
    <span class="legend-square legend-3"></span>
    <span>25% to less than 50%</span>
  </div>
  <div class="legend-item">
    <span class="legend-square legend-4"></span>
    <span>less than 25%</span>
  </div>
</div>

<p class="widget-note">Sources: TOSV and the Wildfire Collaborative Roaring Fork Valley<br> Credit: Laurine Lassalle - Aspen Journalism</p></main>
  

<script>
const scenarios = [
  {image:"current.jpg", title:"No mitigation", alt:"Landscape under No mitigation scenario"},
  {image:"mitigation5M.jpg", title:"Mitigation ($5M)", alt:"Landscape under the Mitigation ($5M) scenario"},
  {image:"mitigationHardening5M.jpg", title:"Mitigation and Hardening ($5M)", alt:"Landscape under the Mitigation and Hardening ($5M) scenario"},
  {image:"mitigation25M.jpg", title:"Mitigation ($25M)", alt:"Landscape under the Mitigation ($25M) scenario"},
  {image:"mitigationHardening25M.jpg", title:"Mitigation and Hardening ($25M)", alt:"Landscape under the Mitigation and Hardening ($25M) scenario"}
];

const imageEl = document.getElementById("scenario-image");
const buttons = [...document.querySelectorAll(".scenario-button")];

function showScenario(index) {
  const s = scenarios[index];
  if (!s) return;

  imageEl.onerror = () => {
    imageEl.onerror = null;
    imageEl.alt = s.alt + " (Image could not be loaded; check the image path.)";
  };

  imageEl.src = s.image;
  imageEl.alt = s.alt;

  buttons.forEach((button, i) => {
    button.setAttribute("aria-pressed", String(i === index));
  });
}

buttons.forEach(button => {
  button.addEventListener("click", () => {
    showScenario(Number(button.dataset.index));
  });
});

showScenario(0);
</script>
  
  
</body></html>
